name: GrantBot Firm Eval

# Manual-only. This runs the model-in-the-loop FIRM GrantBot reasoning eval
# (lib/grantbot/firm-prompt.eval.test.ts) — the Brick 1 trust gate that proves the
# roster-wide firm bot strategizes correctly over PROFILES ONLY before we commit to
# persistence (Brick 2). It is NOT part of CI: it makes real (paid) model calls, so
# it only runs when a human clicks "Run workflow".
#
# The button appears under Actions → "GrantBot Firm Eval" only once this file is on
# the default branch (main).
#
# WHAT IT PROVES (Layer 1, automated pass/fail):
#   1. Roster awareness + prime/sub differentiation + scope — names ACTUAL roster
#      clients and separates prime-capable from partner/support, reasoning across
#      the roster.
#   2. No-force-fit — a poor-fit theme gets an honest "none are a real fit".
#   3. DEFERRAL IS A PASS — a specific grant not in the profiles-only context is
#      deferred to the NOFO / official source, not fabricated. The correct answer.
#   4. No-invent + source precedence — a planted wrong derived summary does not
#      override the typed identity.
#   5. Domestic-only — an international program is flagged, never put forward.
#
# SECRETS. Synthetic fixture roster + the real model, no production DB — so it needs
# ONLY ANTHROPIC_API_KEY. It declares the SAME protected GitHub Environment as the
# other evals ("subseat-eval", Settings → Environments, restricted to `main`), which
# already holds ANTHROPIC_API_KEY; nothing new to add. No tools/web are exercised
# (Brick 1 is a single-shot reasoning call, no fetch/artifact/vision).

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per case (stability sampling; FIRM_EVAL_RUNS). Serial, so raising this grows both cost and wall-clock roughly linearly."
        required: false
        default: "3"

# Never let two eval runs race on the same paid job.
concurrency:
  group: grantbot-firm-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    # Environment-scoped secret: GitHub injects this environment's secrets only into a job that declares
    # it, and enforces the environment's branch policy — so the key can't be read by an arbitrary dispatch
    # ref. We reuse subseat-eval only for its ANTHROPIC_API_KEY.
    environment: subseat-eval
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail LOUD if the key is unset/misnamed. Without this an empty ANTHROPIC_API_KEY trips the eval's own
      # RUN gate (skipIf), every case is skipped, and vitest still exits 0 — a green check that verified
      # nothing. The whole point of this job is to be a trustworthy gate, so a silent skip must be a hard
      # failure instead.
      - name: Verify ANTHROPIC_API_KEY is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY is empty or unset — add it to the 'subseat-eval' GitHub Environment (Settings → Environments). The eval would otherwise silently skip and report a false green."
            exit 1
          fi
      - name: Run GrantBot firm eval
        env:
          RUN_FIRM_EVAL: "1"
          FIRM_EVAL_RUNS: ${{ inputs.runs }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The per-case answers the eval console.logs (and the soft-assertion messages) are captured in this
        # step's log, so the roster-awareness / no-force-fit / deferral reads are readable in the browser
        # with pass/fail.
        run: npx vitest run lib/grantbot/firm-prompt.eval.test.ts
