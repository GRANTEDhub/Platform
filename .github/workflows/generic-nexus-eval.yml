name: Generic Nexus Eval

# Manual-only. This runs the model-in-the-loop generic-over-specific eval
# (lib/grants/generic-nexus.eval.test.ts) — the gate that must pass before
# MATCH_GENERIC_NEXUS_GATE_ENABLED is flipped on. It is NOT part of CI: it makes
# real (paid) Anthropic calls (scoring + the scoped nexus classifier) and reads
# production grant/client rows (read-only, service role), so it only runs when a
# human clicks "Run workflow".
#
# The button appears under Actions → "Generic Nexus Eval" only once this file is
# on the default branch (main).
#
# SECRETS ARE ENVIRONMENT-SCOPED, NOT REPO-SCOPED. This job reuses the SAME protected
# GitHub Environment as the subseat / mission-gate evals — "subseat-eval" (Settings →
# Environments) — which already holds ANTHROPIC_API_KEY, NEXT_PUBLIC_SUPABASE_URL, and
# SUPABASE_SERVICE_ROLE_KEY, restricted to the `main` branch. SUPABASE_SERVICE_ROLE_KEY
# bypasses RLS (full prod DB); a repo-level secret would be readable by ANY workflow on ANY
# branch, so it stays environment-scoped and only a job declaring `environment: subseat-eval`
# (this one) can read it. No new environment or secrets to add — reusing the existing one.
# The eval sets MATCH_GENERIC_NEXUS_GATE_ENABLED itself (ON for the classifier phase), so
# that flag is deliberately NOT set here.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per fixture (stability sampling; GENERIC_NEXUS_EVAL_RUNS). Calls run concurrently (see 'concurrency'), so raising this grows cost more than wall-clock."
        required: false
        default: "3"
      concurrency:
        description: "Max concurrent score+classify chains (GENERIC_NEXUS_EVAL_CONCURRENCY). Higher = faster but more Anthropic load; lower it if you see 429 rate limits."
        required: false
        default: "6"

# Never let two eval runs race on the same paid/prod-reading job.
concurrency:
  group: generic-nexus-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    # Environment-scoped secrets (see header): GitHub injects this environment's secrets only
    # into a job that declares it, and enforces the environment's branch policy at the platform
    # level — so the RLS-bypassing service-role key can't be read by an arbitrary dispatch ref or
    # an attacker-authored workflow that doesn't declare this environment.
    environment: subseat-eval
    # Generous outer cap. The eval batches all score+classify chains with capped concurrency, so a
    # default run is a few minutes; this ceiling just bounds a badly rate-limited run. (The eval's
    # own beforeAll timeout scales with runs/concurrency — floored at 10 min, capped at 55 min — so
    # it stays just inside this cap even in the worst case.)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: createServiceClient() pulls in @supabase/realtime-js, which throws at
          # construction ("Node.js 20 detected without native WebSocket support") when there is no
          # global WebSocket. Node exposes WebSocket unflagged from 22.4; Node 20 never does. This is
          # isolated to the eval job — ci.yml stays on 20 — so it needs no app-code change.
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail LOUD if a secret is unset/misnamed. Without this, an empty ANTHROPIC_API_KEY trips the
      # eval's own RUN gate (skipIf), every fixture is skipped, and vitest still exits 0 — a green
      # check that verified nothing. The whole point of this job is to be a trustworthy flip gate,
      # so a silent skip must be a hard failure instead.
      - name: Verify required secrets are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for v in ANTHROPIC_API_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty or unset — add it to the 'subseat-eval' GitHub Environment (Settings → Environments). The eval would otherwise silently skip and report a false green."
              missing=1
            fi
          done
          [ "$missing" = 0 ]
      - name: Run generic-nexus eval
        env:
          RUN_GENERIC_NEXUS_EVAL: "1"
          GENERIC_NEXUS_EVAL_RUNS: ${{ inputs.runs }}
          GENERIC_NEXUS_EVAL_CONCURRENCY: ${{ inputs.concurrency }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # The per-fixture reads the eval console.logs / assertion messages are captured in this
        # step's log, so the FLAG/KEEP/MIDDLE band report is readable in the browser with pass/fail.
        run: npx vitest run lib/grants/generic-nexus.eval.test.ts
