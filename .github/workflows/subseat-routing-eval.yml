name: Subseat Routing Eval

# Manual-only. This runs the model-in-the-loop supporting-seat routing eval
# (lib/grants/subseat-routing.eval.test.ts) — the gate that must pass before
# MATCH_SUBSEAT_ROUTING_ENABLED is flipped on. It is NOT part of CI: it makes
# real (paid) Anthropic calls and reads production grant/client rows (read-only,
# service role), so it only runs when a human clicks "Run workflow".
#
# The button appears under Actions → "Subseat Routing Eval" only once this file
# is on the default branch (main).
#
# SECRETS ARE ENVIRONMENT-SCOPED, NOT REPO-SCOPED. Add the three secrets to a protected
# GitHub Environment named "subseat-eval" (Settings → Environments), NOT under repo-level
# Actions secrets. SUPABASE_SERVICE_ROLE_KEY bypasses RLS (full prod DB), and a repo-level
# secret is readable by ANY workflow run on ANY branch — a push-access collaborator could
# add their own workflow to exfiltrate it. Restrict the environment to the `main` branch
# (deployment-branch policy) and optionally require a reviewer; then only a job that
# declares `environment: subseat-eval` (this one) can read them, gated by that policy.
# Environment secrets: ANTHROPIC_API_KEY, NEXT_PUBLIC_SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY.
# The eval toggles MATCH_SUBSEAT_ROUTING_ENABLED itself (OFF then ON per fixture),
# so that flag is deliberately NOT set here.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "Runs per fixture per flag state (stability sampling; higher = slower + more Anthropic spend). Per-fixture timeout scales with this; the whole job is capped at 60 min, so keep runs ≤ ~6 for a full 8-fixture pass."
        required: false
        default: "3"

# Never let two eval runs race on the same paid/prod-reading job.
concurrency:
  group: subseat-routing-eval
  cancel-in-progress: false

jobs:
  eval:
    runs-on: ubuntu-latest
    # Environment-scoped secrets (see header): GitHub injects this environment's secrets
    # only into a job that declares it, and enforces the environment's branch policy at the
    # platform level — so the RLS-bypassing service-role key can't be read by an arbitrary
    # dispatch ref or an attacker-authored workflow that doesn't declare this environment.
    environment: subseat-eval
    # Fixed outer cap; GitHub expressions can't do arithmetic on `runs`, so this is a static
    # ceiling sized to cover runs ≤ ~6 (8 fixtures × 2 × runs sequential Anthropic calls).
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, not 20: createServiceClient() pulls in @supabase/realtime-js, which throws
          # at construction ("Node.js 20 detected without native WebSocket support") when
          # there is no global WebSocket. Node exposes WebSocket unflagged from 22.4; Node 20
          # never does. This is isolated to the eval job — ci.yml stays on 20 — so it needs no
          # app-code change to server.ts and no `ws` dependency.
          node-version: 22
          cache: npm
      - run: npm ci
      # Fail LOUD if a secret is unset/misnamed. Without this, an empty ANTHROPIC_API_KEY
      # trips the eval's own RUN gate (skipIf), every fixture is skipped, and vitest still
      # exits 0 — a green check that verified nothing. The whole point of this job is to be
      # a trustworthy flip gate, so a silent skip must be a hard failure instead.
      - name: Verify required secrets are present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=0
          for v in ANTHROPIC_API_KEY NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY; do
            if [ -z "${!v}" ]; then
              echo "::error::$v is empty or unset — add it to the 'subseat-eval' GitHub Environment (Settings → Environments). The eval would otherwise silently skip and report a false green."
              missing=1
            fi
          done
          [ "$missing" = 0 ]
      - name: Run subseat-routing eval
        env:
          RUN_SUBSEAT_EVAL: "1"
          SUBSEAT_EVAL_RUNS: ${{ inputs.runs }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # The per-fixture OFF/ON rows the eval console.logs are captured in this
        # step's log, so the report is readable in the browser alongside pass/fail.
        run: npx vitest run lib/grants/subseat-routing.eval.test.ts
